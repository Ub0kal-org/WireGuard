apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "headscale.fullname" . }}-admin
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "headscale.fullname" . }}-admin
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "headscale.fullname" . }}-admin
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "headscale.fullname" . }}-admin
roleRef:
  kind: Role
  name: {{ include "headscale.fullname" . }}-admin
  apiGroup: rbac.authorization.k8s.io
