apiVersion: v1
kind: Service
metadata:
  name: {{ include "headscale.fullname" . }}
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "headscale.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: {{ .Values.headscale.listenPort }}
      protocol: TCP
    {{- if .Values.ui.enabled }}
    - name: ui
      port: {{ .Values.service.uiPort }}
      targetPort: {{ .Values.ui.port }}
      protocol: TCP
    {{- end }}
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: {{ .Values.headscale.metricsPort }}
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: {{ .Values.headscale.grpcPort }}
      protocol: TCP
{{- if .Values.service.stun.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "headscale.fullname" . }}-stun
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.stun.type }}
  selector:
    {{- include "headscale.selectorLabels" . | nindent 4 }}
  ports:
    - name: stun
      port: {{ .Values.service.stun.port }}
      targetPort: {{ .Values.headscale.stunPort }}
      protocol: UDP
{{- end }}
