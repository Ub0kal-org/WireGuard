apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "headscale.fullname" . }}-config
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
data:
  config.yaml: |
    server_url: {{ .Values.headscale.serverUrl }}
    listen_addr: 0.0.0.0:{{ .Values.headscale.listenPort }}
    metrics_listen_addr: 0.0.0.0:{{ .Values.headscale.metricsPort }}
    grpc_listen_addr: 0.0.0.0:{{ .Values.headscale.grpcPort }}
    grpc_allow_insecure: false

    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    prefixes:
      v4: {{ .Values.headscale.ipPrefixes.v4 }}
      v6: {{ .Values.headscale.ipPrefixes.v6 }}
      allocation: sequential

    derp:
      server:
        enabled: true
        region_id: 999
        region_code: "keksi"
        region_name: "Keksi DERP & STUN Relay"
        stun_listen_addr: 0.0.0.0:{{ .Values.headscale.stunPort }}
        private_key_path: /var/lib/headscale/derp_server_private.key
        automatically_add_embedded_derp_region: true
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      paths: []
      auto_update_enabled: true
      update_frequency: 24h

    disable_check_updates: true

    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite
        write_ahead_log: true

    dns:
      magic_dns: true
      base_domain: {{ .Values.headscale.baseDomain }}
      nameservers:
        global:
          {{- range .Values.headscale.nameservers }}
          - {{ . | quote }}
          {{- end }}
        split: {}
      search_domains: []
      extra_records: []

    log:
      format: text
      level: info

    policy:
      mode: file
      path: /etc/headscale/acl.hujson

  acl.hujson: |
    {
      "acls": [
        {
          "action": "accept",
          "src": ["*"],
          "dst": ["*:*"]
        }
      ]
    }
