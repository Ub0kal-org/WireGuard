apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: headscale
  labels:
    app.kubernetes.io/name: headscale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headscale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headscale
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0

      initContainers:
        - name: setup-web-staging
          image: ghcr.io/gurucomputing/headscale-ui:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - "mkdir -p /web-staging && cp -r /web/* /web-staging/"
          volumeMounts:
            - name: web-staging
              mountPath: /web-staging

      containers:
        - name: headscale
          image: ghcr.io/juanfont/headscale:v0.29.3
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: stun-udp
              containerPort: 3478
              protocol: UDP
            - name: grpc
              containerPort: 50443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/headscale
            - name: data
              mountPath: /var/lib/headscale
            - name: run
              mountPath: /var/run/headscale

        - name: headscale-ui
          image: ghcr.io/gurucomputing/headscale-ui:latest
          ports:
            - name: ui
              containerPort: 80
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: "80"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: web-shared
              mountPath: /web

        - name: auto-auth-sidecar
          image: ghcr.io/gurucomputing/headscale-ui:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "[auto-auth] Initializing Web UI assets..."
              mkdir -p /web-shared
              cp -r /web-staging/* /web-shared/

              while true; do
                if [ -f /var/lib/headscale/web_api_key.txt ] && [ -s /var/lib/headscale/web_api_key.txt ]; then
                  API_KEY=$(cat /var/lib/headscale/web_api_key.txt | tr -d '\r\n ')
                  if [ -n "$API_KEY" ] && ! grep -q "$API_KEY" /web-shared/index.html 2>/dev/null; then
                    echo "[auto-auth] Injecting API Key into Web UI..."
                    sed -i 's/<meta http-equiv="content-security-policy"[^>]*>//g' /web-shared/index.html /web-shared/settings.html 2>/dev/null || true
                    INJECT="<script>localStorage.setItem('headscaleURL','https:\/\/headscale.keksi.si');localStorage.setItem('headscaleAPIKey','$API_KEY');<\/script>"
                    sed -i "s/<\/head>/$INJECT<\/head>/" /web-shared/index.html /web-shared/settings.html 2>/dev/null || true
                    echo "[auto-auth] Auto-login successfully injected!"
                  fi
                fi
                sleep 5
              done
          volumeMounts:
            - name: data
              mountPath: /var/lib/headscale
            - name: run
              mountPath: /var/run/headscale
            - name: web-staging
              mountPath: /web-staging
            - name: web-shared
              mountPath: /web-shared

      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
        - name: run
          emptyDir: {}
        - name: web-staging
          emptyDir: {}
        - name: web-shared
          emptyDir: {}
