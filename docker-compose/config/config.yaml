# Headscale Standalone Configuration for keksi.si
server_url: https://headscale.keksi.si
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false

private_key_path: /var/lib/headscale/private.key
noise:
  private_key_path: /var/lib/headscale/noise_private.key

ip_prefixes:
  - 100.64.0.0/10
  - fd7a:115c:a1e0::/48

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "keksi"
    region_name: "Keksi DERP & STUN Relay"
    # Port 53 STUN listener for UDP NAT traversal & firewall bypass
    stun_listen_addr: "0.0.0.0:53"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 1.1.1.1
    ipv6: none
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 24h

disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite3
  sqlite:
    path: /var/lib/headscale/db.sqlite

dns:
  magic_dns: true
  base_domain: keksi.si
  nameservers:
    - 1.1.1.1
    - 8.8.8.8
  search_domains: []
  extra_records: []

log:
  format: text
  level: info

policy:
  mode: file
  path: /etc/headscale/acl.hujson
